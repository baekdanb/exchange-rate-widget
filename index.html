<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>환율 위젯</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .container { width: 100%; max-width: 760px; }

    /* 메인 레이아웃: 환율카드(왼쪽) + 계산기(오른쪽) */
    .main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }

    /* 환율 카드 두 개 세로로 */
    .cards { display: flex; flex-direction: column; gap: 12px; }
    .card { background: #f9f9f8; border: 1px solid #e5e5e3; border-radius: 14px; padding: 1.1rem; flex: 1; }
    .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .flag { font-size: 22px; }
    .label { font-size: 13px; color: #888; }
    .sublabel { font-size: 11px; color: #aaa; margin-top: 1px; }
    .rate { font-size: 26px; font-weight: 600; color: #1a1a1a; letter-spacing: -0.5px; margin-bottom: 2px; }
    .unit { font-size: 12px; color: #aaa; margin-bottom: 8px; }
    .change { font-size: 12px; color: #aaa; }
    .change.up { color: #e05140; }
    .change.down { color: #0f8060; }

    /* 계산기 */
    .calc { background: #f9f9f8; border: 1px solid #e5e5e3; border-radius: 14px; padding: 1.1rem; display: flex; flex-direction: column; }
    .calc-title { font-size: 13px; color: #888; margin-bottom: 12px; }
    .calc-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab {
      flex: 1; padding: 7px; font-size: 12px; font-weight: 500;
      border: 1px solid #e5e5e3; border-radius: 8px;
      background: #fff; color: #aaa; cursor: pointer; transition: all 0.15s;
    }
    .tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .calc-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .calc-row label { font-size: 12px; color: #888; min-width: 32px; }
    .calc-row input {
      flex: 1; padding: 9px 10px; font-size: 15px; font-weight: 500;
      border: 1px solid #e0e0de; border-radius: 9px;
      background: #fff; color: #1a1a1a; outline: none;
      transition: border 0.15s; min-width: 0;
    }
    .calc-row input:focus { border-color: #1a1a1a; }
    .calc-row .currency { font-size: 12px; color: #aaa; min-width: 28px; }
    .calc-arrow { text-align: center; color: #ccc; font-size: 16px; margin: 4px 0; }

    /* 하단 */
    .footer { display: flex; align-items: center; justify-content: space-between; }
    .updated { font-size: 11px; color: #bbb; }
    .refresh-btn {
      font-size: 12px; color: #666; background: none;
      border: 1px solid #ddd; border-radius: 8px;
      padding: 5px 12px; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: background 0.15s;
    }
    .refresh-btn:hover { background: #f0f0f0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="main">

      <!-- 왼쪽: 환율 카드 두 개 -->
      <div class="cards">
        <div class="card">
          <div class="card-header">
            <span class="flag">🇺🇸</span>
            <div>
              <div class="label">미국 달러</div>
              <div class="sublabel">USD → KRW</div>
            </div>
          </div>
          <div class="rate" id="usd-rate">—</div>
          <div class="unit">원 / 1달러</div>
          <div class="change" id="usd-change">불러오는 중...</div>
        </div>
        <div class="card">
          <div class="card-header">
            <span class="flag">🇯🇵</span>
            <div>
              <div class="label">일본 엔</div>
              <div class="sublabel">JPY → KRW</div>
            </div>
          </div>
          <div class="rate" id="jpy-rate">—</div>
          <div class="unit">원 / 100엔</div>
          <div class="change" id="jpy-change">불러오는 중...</div>
        </div>
      </div>

      <!-- 오른쪽: 계산기 -->
      <div class="calc">
        <div class="calc-title">환율 계산기</div>
        <div class="calc-tabs">
          <button class="tab active" onclick="setTab('usd')">🇺🇸 달러 ↔ 원</button>
          <button class="tab" onclick="setTab('jpy')">🇯🇵 엔 ↔ 원</button>
        </div>
        <div class="calc-row">
          <label id="from-label">달러</label>
          <input type="number" id="from-input" placeholder="0" oninput="calcFrom()" />
          <span class="currency" id="from-currency">USD</span>
        </div>
        <div class="calc-arrow">↕</div>
        <div class="calc-row">
          <label id="to-label">원</label>
          <input type="number" id="to-input" placeholder="0" oninput="calcTo()" />
          <span class="currency" id="to-currency">KRW</span>
        </div>
      </div>

    </div>

    <div class="footer">
      <span class="updated" id="last-updated"></span>
      <button class="refresh-btn" onclick="fetchRates()">↻ 새로고침</button>
    </div>
  </div>

  <script>
    let rates = { usd: 0, jpy: 0 };
    let currentTab = 'usd';

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && tab === 'usd') || (i === 1 && tab === 'jpy'));
      });
      if (tab === 'usd') {
        document.getElementById('from-label').textContent = '달러';
        document.getElementById('from-currency').textContent = 'USD';
        document.getElementById('to-label').textContent = '원';
        document.getElementById('to-currency').textContent = 'KRW';
      } else {
        document.getElementById('from-label').textContent = '엔';
        document.getElementById('from-currency').textContent = 'JPY';
        document.getElementById('to-label').textContent = '원';
        document.getElementById('to-currency').textContent = 'KRW';
      }
      document.getElementById('from-input').value = '';
      document.getElementById('to-input').value = '';
    }

    function calcFrom() {
      const val = parseFloat(document.getElementById('from-input').value);
      if (isNaN(val)) { document.getElementById('to-input').value = ''; return; }
      const rate = currentTab === 'usd' ? rates.usd : rates.jpy / 100;
      document.getElementById('to-input').value = Math.round(val * rate);
    }

    function calcTo() {
      const val = parseFloat(document.getElementById('to-input').value);
      if (isNaN(val)) { document.getElementById('from-input').value = ''; return; }
      const rate = currentTab === 'usd' ? rates.usd : rates.jpy / 100;
      if (rate === 0) return;
      document.getElementById('from-input').value = (val / rate).toFixed(2);
    }

    async function fetchRates() {
      document.getElementById('usd-rate').textContent = '...';
      document.getElementById('jpy-rate').textContent = '...';
      document.getElementById('usd-change').textContent = '불러오는 중...';
      document.getElementById('usd-change').className = 'change';
      document.getElementById('jpy-change').textContent = '불러오는 중...';
      document.getElementById('jpy-change').className = 'change';

      try {
        const res = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');
        const today = await res.json();

        const usdToKrw = today.usd.krw;
        const jpyRate = (today.usd.krw / today.usd.jpy) * 100;

        rates.usd = usdToKrw;
        rates.jpy = jpyRate;

        document.getElementById('usd-rate').textContent = Math.round(usdToKrw).toLocaleString('ko-KR');
        document.getElementById('jpy-rate').textContent = Math.round(jpyRate).toLocaleString('ko-KR');

        try {
          const yesterday = new Date();
          yesterday.setDate(yesterday.getDate() - 1);
          const yStr = yesterday.toISOString().split('T')[0];
          const prevRes = await fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${yStr}/v1/currencies/usd.json`);
          const prev = await prevRes.json();
          const prevUsd = prev.usd.krw;
          const prevJpy = (prev.usd.krw / prev.usd.jpy) * 100;

          function setChange(id, diff) {
            const el = document.getElementById(id);
            const sign = diff >= 0 ? '+' : '';
            const arrow = diff >= 0 ? '▲' : '▼';
            el.textContent = `${arrow} ${sign}${Math.abs(diff).toFixed(1)}원 (전일 대비)`;
            el.className = 'change ' + (diff >= 0 ? 'up' : 'down');
          }
          setChange('usd-change', usdToKrw - prevUsd);
          setChange('jpy-change', jpyRate - prevJpy);
        } catch(e) {
          document.getElementById('usd-change').textContent = '';
          document.getElementById('jpy-change').textContent = '';
        }

        const now = new Date();
        document.getElementById('last-updated').textContent = '업데이트: ' + now.toLocaleString('ko-KR');

      } catch(err) {
        document.getElementById('usd-rate').textContent = '오류';
        document.getElementById('jpy-rate').textContent = '오류';
        document.getElementById('usd-change').textContent = '네트워크 오류';
        document.getElementById('jpy-change').textContent = '';
      }
    }

    fetchRates();
  </script>
</body>
</html>
